name: customer-portal

# Per ADR-009 (per-app workflow architecture). Node backend + Node frontend.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/customer-portal/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/apps.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/customer-portal/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/apps.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-portal:
    name: customer-portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            apps/customer-portal/pnpm-lock.yaml
            apps/customer-portal/frontend/pnpm-lock.yaml

      # Backend (Node / Express + TypeScript)
      - name: backend — install
        working-directory: apps/customer-portal
        run: pnpm install --frozen-lockfile
      - name: backend — lint
        working-directory: apps/customer-portal
        run: pnpm lint
      - name: backend — typecheck
        working-directory: apps/customer-portal
        run: pnpm typecheck
      - name: backend — build
        working-directory: apps/customer-portal
        run: pnpm build
      - name: backend — tests
        working-directory: apps/customer-portal
        run: pnpm test

      # Frontend (Node / Vite + React)
      - name: frontend — install
        working-directory: apps/customer-portal/frontend
        run: pnpm install --frozen-lockfile
      - name: frontend — lint
        working-directory: apps/customer-portal/frontend
        run: pnpm lint
      - name: frontend — typecheck
        working-directory: apps/customer-portal/frontend
        run: pnpm typecheck
      - name: frontend — build
        working-directory: apps/customer-portal/frontend
        run: pnpm build
      - name: frontend — tests
        working-directory: apps/customer-portal/frontend
        run: pnpm test
