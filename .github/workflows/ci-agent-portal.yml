name: agent-portal

# Per ADR-009 (per-app workflow architecture). Java/Maven backend + Node frontend.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/agent-portal/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/apps.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/agent-portal/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/apps.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-portal:
    name: agent-portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Backend (Java 21 / Maven Wrapper)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: backend — build + test
        working-directory: apps/agent-portal
        run: ./mvnw -B verify

      # Frontend (Node / pnpm)
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/agent-portal/frontend/pnpm-lock.yaml
      - name: frontend — install
        working-directory: apps/agent-portal/frontend
        run: pnpm install --frozen-lockfile
      - name: frontend — lint
        working-directory: apps/agent-portal/frontend
        run: pnpm lint
      - name: frontend — format:check
        working-directory: apps/agent-portal/frontend
        run: pnpm format:check
      - name: frontend — typecheck
        working-directory: apps/agent-portal/frontend
        run: pnpm typecheck
      - name: frontend — build
        working-directory: apps/agent-portal/frontend
        run: pnpm build
      - name: frontend — tests
        working-directory: apps/agent-portal/frontend
        run: pnpm test
