name: dashboard

# Per ADR-009 (per-app workflow architecture). Python backend + Node frontend.

on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/dashboard.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.claude/rules/dashboard.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Backend (Python / uv)
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - name: backend — install
        working-directory: dashboard
        run: uv sync --frozen
      - name: backend — lint
        working-directory: dashboard
        run: |
          uv run ruff check .
          uv run black --check .
      - name: backend — tests
        working-directory: dashboard
        run: uv run pytest -q

      # Frontend (Node / pnpm)
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dashboard/frontend/pnpm-lock.yaml
      - name: frontend — install
        working-directory: dashboard/frontend
        run: pnpm install --frozen-lockfile
      - name: frontend — lint
        working-directory: dashboard/frontend
        run: pnpm lint
      - name: frontend — format:check
        working-directory: dashboard/frontend
        run: pnpm format:check
      - name: frontend — typecheck
        working-directory: dashboard/frontend
        run: pnpm typecheck
      - name: frontend — build
        working-directory: dashboard/frontend
        run: pnpm build
      - name: frontend — tests
        working-directory: dashboard/frontend
        run: pnpm test
