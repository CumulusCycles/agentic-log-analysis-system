[project]
name = "log-dashboard"
version = "0.1.0"
description = "Agentic Log Analysis Dashboard — standalone admin UI consuming logs from the four insurance apps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "structlog==24.4.0",
    "python-multipart==0.0.20",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.2.2",
    "langsmith==0.8.9",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "asgi-lifespan==2.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Skip the React workspace — pnpm installs npm packages that include vendored
# .py files (eg. flat-cache → flatted/python/flatted.py) that black would
# otherwise rewrite.
extend-exclude = "frontend/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI uses Depends() in argument defaults — that is the documented pattern.
ignore = ["B008"]
