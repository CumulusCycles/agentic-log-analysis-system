[project]
name = "shared-data-api"
version = "0.1.0"
description = "Sole data-access layer for the Agentic Log Analysis System insurance apps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "motor==3.6.0",
    "pymongo==4.9.2",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "structlog==24.4.0",
    "python-multipart==0.0.20",
    "alembic==1.18.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "black==24.10.0",
    "mongomock-motor==0.0.34",
    "aiosqlite==0.20.0",
    "asgi-lifespan==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_data_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Alembic-generated migrations include long inline SQL strings (CHECK constraint
# bodies) that can't break cleanly. Style is governed by alembic/script.py.mako.
extend-exclude = "alembic/versions/.*"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI uses Depends() in argument defaults — that is the documented pattern.
ignore = ["B008"]
